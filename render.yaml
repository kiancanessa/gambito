# Despliegue GRATUITO en Render (Blueprint): New + → Blueprint → elige este repositorio.
#
# El plan gratuito no tiene disco persistente y se duerme a los 15 min sin tráfico, así que:
#   - la base de datos SQLite se copia a un Postgres gratuito de Neon (DATABASE_URL) y se restaura al arrancar
#     (ver server/persist.js);
#   - un monitor gratuito (UptimeRobot) llama a /healthz cada 5 min para que no se duerma.
# Guía paso a paso en docs/DEPLOY.md. Si algún día quieres más fiabilidad: plan "starter" + un disco en /data.
services:
  - type: web
    name: gambito
    runtime: docker
    plan: free
    region: oregon # cerca de México y EE. UU.; otras: ohio, virginia, frankfurt, singapore
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/gambito # disco efímero: la copia buena vive en Neon
      # Cliente alojado en Vercel autorizado a usar la API y el WebSocket (separa varios con comas).
      - key: ALLOWED_ORIGINS
        value: https://gambito-five.vercel.app
      # Dos cuentas de la misma IP no se emparejan en clasificatoria (para jugar juntos en casa: partida con amigo).
      - key: BLOCK_SAME_IP_RANKED
        value: '1'
      # Token para leer /api/metrics (secreto, opcional): si no lo defines, el endpoint no existe. Ver docs/DEPLOY.md.
      - key: METRICS_TOKEN
        sync: false
      # Cadena de conexión de Neon (secreto): la pegas tú en el panel de Render, no se guarda en el repositorio.
      - key: DATABASE_URL
        sync: false
