# Despliegue en Render (Blueprint). Los discos persistentes requieren un plan de pago; en el plan gratuito
# la base de datos (cuentas, guardados, ranking) se reinicia en cada despliegue: úsalo solo para probar.
services:
  - type: web
    name: gambito
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
    disk:
      name: gambito-data
      mountPath: /data
      sizeGB: 1
